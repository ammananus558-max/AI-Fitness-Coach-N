<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Users · Admin · AI FITNESS COACH</title>
<script src="../js/theme.js"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="../css/style.css" rel="stylesheet"><link href="../css/admin.css" rel="stylesheet">
<link href="../css/animations.css" rel="stylesheet"><link href="../css/responsive.css" rel="stylesheet">
</head>
<body>
<div class="admin-shell"><aside id="sidebarMount"></aside>
<div class="admin-body"><header id="headerMount"></header><main class="admin-main" id="mainContent">
  <div class="admin-toolbar">
    <input type="text" class="form-control search-box" id="searchInput" placeholder="Search users...">
    <select class="form-select w-auto" id="goalFilter"><option value="">All Goals</option></select>
    <select class="form-select w-auto" id="statusFilter">
      <option value="">All Status</option><option value="active">Active</option><option value="disabled">Disabled</option>
    </select>
  </div>
  <div class="tile admin-table-card" id="tableWrap"></div>
</main></div></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/utils.js"></script>
<script src="../js/storage.js"></script>
<script src="../js/app.js"></script>
<script src="../js/demo-data.js"></script><script src="../js/personalization.js"></script>
<script src="../js/admin-auth.js"></script><script src="../js/admin.js"></script>
<script>
(async function () {
  try { await requireAdmin(); } catch (e) { return; }
  afcMountLayout("users", { admin: true });
  renderGoalOptions();

  var allUsers = {};

  function renderGoalOptions() {
    var select = document.getElementById("goalFilter");
    (window.AFC_GOALS || []).forEach(function (goal) {
      var option = document.createElement("option");
      option.value = goal.key;
      option.textContent = goal.label;
      select.appendChild(option);
    });
  }

  function userGoal(user) {
    return afcNormalizeGoal(user && ((user.profile && user.profile.goal) || user.goal));
  }

  function subChip(u) {
    if (u.subscription && u.subscription.status === "active") return '<span class="badge bg-success">Active</span>';
    if (u.trial) return '<span class="badge bg-warning text-dark">Trial</span>';
    return '<span class="badge bg-secondary">None</span>';
  }

  function statusChip(u) {
    if (u.status === "disabled") return '<span class="badge bg-danger">Disabled</span>';
    return '<span class="badge bg-success">Active</span>';
  }

  function renderTable() {
    var goalQ = document.getElementById("goalFilter").value;
    var statusQ = document.getElementById("statusFilter").value;
    var filtered = [];
    Object.keys(allUsers).forEach(function (k) {
      var u = allUsers[k];
      if (!u) return;
      if (goalQ && userGoal(u) !== goalQ) return;
      if (statusQ && (u.status || "active") !== statusQ) return;
      filtered.push([k, u]);
    });
    /* Sort by createdAt desc */
    filtered.sort(function (a, b) { return (b[1].createdAt || 0) - (a[1].createdAt || 0); });

    var html = afcAdminTable({
      columns: [
        { key: "name", label: "Name", render: function (row) {
          var initials = (row.name || "?")[0].toUpperCase();
          return '<span class="avatar-chip me-2" style="width:32px;height:32px;font-size:0.8rem">' + afcEscape(initials) + '</span>' + afcEscape(row.name || "—");
        }},
        { key: "email", label: "Email" },
        { key: "goal", label: "Goal", render: function (row) { return afcEscape((row.profile && row.profile.goal) || row.goal || "—"); } },
        { key: "level", label: "Level", render: function (row) { return afcEscape((row.profile && (row.profile.fitnessLevel || row.profile.level)) || row.fitnessLevel || "—"); } },
        { key: "activity", label: "Activity", render: function (row) { return afcEscape((row.profile && row.profile.activityLevel) || "—"); } },
        { key: "bmi", label: "BMI", render: function (row) { return row.bmi != null ? row.bmi : "—"; } },
        { key: "calories", label: "Calories", render: function (row) { return row.calories && row.calories.target ? row.calories.target : "—"; } },
        { key: "_sub", label: "Subscription", render: function (row) { return subChip(row); } },
        { key: "_status", label: "Status", render: function (row) { return statusChip(row); } },
        { key: "createdAt", label: "Created", render: function (row) { return row.createdAt ? afcFmtDateTime(row.createdAt) : "—"; } }
      ],
      rows: filtered,
      actions: [
        { icon: "eye-fill", title: "VIEW", cls: "btn-outline-primary" },
        { icon: "pencil-square", title: "EDIT", cls: "btn-outline-warning" },
        { icon: "plus-circle", title: "INCREASE_TRIAL", cls: "btn-outline-success" },
        { icon: "dash-circle", title: "DECREASE_TRIAL", cls: "btn-outline-secondary" },
        { icon: "power", title: "TOGGLE_STATUS", cls: "btn-outline-info" },
        { icon: "trash3-fill", title: "DELETE", cls: "btn-outline-danger" }
      ]
    });
    document.getElementById("tableWrap").innerHTML = html;
    afcAdminSearchFilter("#searchInput", "#tableWrap tr[data-key]");
  }

  afcLoader("Loading users...");
  try {
    var unsub = await afcDbOnValue("users", function (data) {
      allUsers = data || {};
      renderTable();
      afcLoaderOff();
    });
  } catch (err) {
    afcToast("Failed to load users.", "error");
    afcLoaderOff();
  }

  document.getElementById("goalFilter").addEventListener("change", renderTable);
  document.getElementById("statusFilter").addEventListener("change", renderTable);

  afcAdminBindActions(document.getElementById("tableWrap"), {
    VIEW: async function (key) {
      var u = await afcDbGet("users/" + String(key));
      if (!u) return;
      var health = u.health || {};
      var p = u.profile || {};
      var pretty = [
        "Name: " + (u.name || "—"), "Email: " + (u.email || "—"),
        "Age: " + (p.age || "—"), "Gender: " + (p.gender || "—"),
        "Height: " + (p.height || "—") + " cm", "Weight: " + (p.weight || "—") + " kg",
        "BMI: " + ((health.bmi && health.bmi.value) || u.bmi || "—"),
        "Calories: " + ((health.calories && health.calories.target) || (u.calories && u.calories.target) || "—"),
        "Goal: " + ((p.goal || u.goal) || "—"), "Activity: " + (p.activityLevel || "—"),
        "Free trial: " + ((u.trial && u.trial.days) || "—") + " days",
        "Subscription: " + ((u.subscription && u.subscription.status) || "None")
      ].join("\n");
      await afcConfirm({ title: "User: " + (u.name || key), body: '<pre style="max-height:400px;overflow:auto;font-size:0.82rem">' + afcEscape(pretty) + "</pre>", okText: "Close" });
    },
    EDIT: async function (key) {
      var u = allUsers[key];
      if (!u) return;
      var p = u.profile || {};
      var data = await afcFormModal({
        title: "Edit User",
        fields: [
          { key: "name", label: "Name", type: "text", value: u.name || "" },
          { key: "age", label: "Age", type: "number", value: p.age || "" },
          { key: "gender", label: "Gender", type: "select", options: afcGenderOptions(), value: afcNormalizeGender(p.gender) },
          { key: "height", label: "Height (cm)", type: "number", value: p.height || "" },
          { key: "weight", label: "Weight (kg)", type: "number", value: p.weight || "" },
          { key: "goal", label: "Fitness Goal", type: "select", options: afcGoalOptions(), value: afcNormalizeGoal(p.goal || u.goal) },
          { key: "fitnessLevel", label: "Fitness Level", type: "select", options: afcLevelOptions().filter(function (x) { return x.value !== "all"; }), value: afcNormalizeLevel(p.fitnessLevel || u.fitnessLevel) },
          { key: "activityLevel", label: "Activity Level", type: "select", options: [
            { value: "light", label: "Light Activity" }, { value: "moderate", label: "Moderate Activity" },
            { value: "active", label: "Active" }, { value: "very", label: "Very Active" }
          ], value: p.activityLevel || "moderate" },
          { key: "role", label: "Role (note: does NOT grant panel access; admins node is separate)", type: "select", options: ["user", "admin"], value: u.role || "user" },
          { key: "trialDays", label: "Free Trial (1-30 days)", type: "number", value: u.trial && u.trial.days || 7, min: 1, max: 30 }
        ],
        okText: "Save"
      });
      if (!data) return;
      afcBusy(null, false);
      try {
        afcLoader("Saving...");
        var days = Number(data.trialDays);
        if (!Number.isInteger(days) || days < 1 || days > 30) throw new Error("Free Trial must be between 1 and 30 days.");
        var nextProfile = Object.assign({}, p, {
          age: Number(data.age) || p.age || "",
          gender: afcNormalizeGender(data.gender),
          height: Number(data.height) || p.height || "",
          weight: Number(data.weight) || p.weight || "",
          goal: afcNormalizeGoal(data.goal),
          fitnessLevel: afcNormalizeLevel(data.fitnessLevel),
          activityLevel: data.activityLevel
        });
        var bmi = afcCalcBMI(nextProfile.height, nextProfile.weight);
        var calories = afcCalcCalories({ age: Number(nextProfile.age), gender: nextProfile.gender, height: Number(nextProfile.height), weight: Number(nextProfile.weight), activityLevel: nextProfile.activityLevel });
        await afcDbUpdate("users/" + key, { name: data.name, role: data.role, goal: nextProfile.goal, fitnessLevel: nextProfile.fitnessLevel, profile: nextProfile, bmi: bmi, calories: calories });
        await afcDbSet("users/" + key + "/health/bmi", { value: bmi, category: afcBMICategory(bmi).label, height: nextProfile.height, weight: nextProfile.weight, date: afcTodayKey() });
        await afcDbSet("users/" + key + "/health/calories", calories);
        await afcSetTrialDays(key, days);
        afcToast("User updated.", "success");
      } catch (err) {
        afcToast("Failed to update user.", "error");
      }
      afcLoaderOff();
    },
    INCREASE_TRIAL: async function (key) {
      var u = allUsers[String(key)] || {};
      var current = Number(u.trial && u.trial.days) || 7;
      if (current >= 30) { afcToast("Free Trial cannot exceed 30 days.", "warn"); return; }
      try { afcLoader("Updating trial..."); await afcSetTrialDays(key, current + 1); afcToast("Free Trial increased to " + (current + 1) + " days.", "success"); }
      catch (err) { afcToast(err.message, "error"); } finally { afcLoaderOff(); }
    },
    DECREASE_TRIAL: async function (key) {
      var u = allUsers[String(key)] || {};
      var current = Number(u.trial && u.trial.days) || 7;
      if (current <= 1) { afcToast("Free Trial cannot be less than 1 day.", "warn"); return; }
      try { afcLoader("Updating trial..."); await afcSetTrialDays(key, current - 1); afcToast("Free Trial decreased to " + (current - 1) + " days.", "success"); }
      catch (err) { afcToast(err.message, "error"); } finally { afcLoaderOff(); }
    },
    TOGGLE_STATUS: async function (key) {
      var u = allUsers[key];
      if (!u) return;
      var newStatus = u.status === "disabled" ? "active" : "disabled";
      try {
        afcLoader("Updating...");
        await afcDbUpdate("users/" + key, { status: newStatus });
        afcToast("User " + newStatus + ".", "success");
      } catch (err) {
        afcToast("Failed to update status.", "error");
      }
      afcLoaderOff();
    },
    DELETE: async function (key) {
      var ok = await afcConfirmDelete("user " + key);
      if (!ok) return;
      try {
        afcLoader("Deleting...");
        await afcDbRemove("users/" + key);
        afcToast("User deleted.", "success");
      } catch (err) {
        afcToast("Failed to delete user.", "error");
      }
      afcLoaderOff();
    }
  });
})();
</script>
</body>
</html>
