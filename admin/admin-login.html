<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin Login · AI FITNESS COACH</title>
<script src="../js/theme.js"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="../css/style.css" rel="stylesheet"><link href="../css/admin.css" rel="stylesheet">
<link href="../css/animations.css" rel="stylesheet"><link href="../css/responsive.css" rel="stylesheet">
<style>
  .admin-login-bg {
    min-height: 100vh; display: grid; place-items: center;
    background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
    padding: 1rem;
  }
  .admin-login-card {
    width: 100%; max-width: 420px;
    background: var(--surface); border-radius: var(--radius-lg, 1rem);
    padding: 2.5rem 2rem; box-shadow: var(--shadow-lg);
  }
  .admin-login-card .brand-badge { margin: 0 auto 0.8rem; }
</style>
</head>
<body>
<div class="admin-login-bg">
  <div class="auth-card admin-login-card anim-scale" id="loginCard">
    <div class="text-center mb-4">
      <div class="brand-badge"><i class="bi bi-heart-pulse-fill" aria-hidden="true"></i></div>
      <h2 class="fw-bold mt-2">ADMIN LOGIN</h2>
      <p class="text-muted-2 small">AI FITNESS COACH Administration</p>
    </div>
    <form id="adminLoginForm" autocomplete="on">
      <div class="mb-3">
        <label class="form-label" for="email">Email</label>
        <input type="email" class="form-control" id="email" placeholder="admin@gmail.com" required autocomplete="email">
      </div>
      <div class="mb-4">
        <label class="form-label" for="password">Password</label>
        <input type="password" class="form-control" id="password" placeholder="Enter password" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn btn-fire w-100" id="loginBtn">LOGIN</button>
    </form>

    <div class="tile tile-pad mt-4" style="border-radius:12px">
      <div class="stat-label mb-2">DEMO CREDENTIALS</div>
      <div class="text-muted-2" style="font-size:.85rem">
        <div>Email: <code>admin@gmail.com</code></div>
        <div>Password: <code>admin1234</code></div>
      </div>
      <p class="form-hint mb-0 mt-2">
        Frontend-only demo. These credentials live in plain text in
        <code>js/admin-auth.js</code>, so this gate is a convenience, not security.
      </p>
    </div>

    <div class="text-center mt-3">
      <a href="../login.html" class="text-muted-2 small text-decoration-none">&larr; Back to User Login</a>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/utils.js"></script>
<script src="../js/storage.js"></script>
<script src="../js/app.js"></script>
<script src="../js/demo-data.js"></script><script src="../js/personalization.js"></script>
<script src="../js/admin-auth.js"></script>
<script src="../js/admin.js"></script>
<script>
(function () {
  var form = document.getElementById("adminLoginForm");
  var btn = document.getElementById("loginBtn");

  /* Confirm the storage engine loaded before wiring the form. */
  if (!window.AFC_STORAGE_READY) {
    afcToast("Storage engine failed to load.", "error");
    return;
  }

  form.addEventListener("submit", async function (e) {
    e.preventDefault();
    var email = document.getElementById("email").value.trim();
    var password = document.getElementById("password").value;
    if (!email || !password) { afcToast("Please fill in all fields.", "error"); return; }

    afcBusy(btn, true, "Signing in...");
    try {
      await afcAdminLogin(email, password);
      location.href = "dashboard.html";
    } catch (err) {
      afcBusy(btn, false);
      afcToast(afcFriendlyAuthError(err), "error");
    }
  });
})();
</script>
</body>
</html>
