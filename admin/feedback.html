<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Feedback · Admin · AI FITNESS COACH</title><script src="../js/theme.js"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="../css/style.css" rel="stylesheet"><link href="../css/admin.css" rel="stylesheet"><link href="../css/animations.css" rel="stylesheet"><link href="../css/responsive.css" rel="stylesheet"></head>
<body><div class="admin-shell"><aside id="sidebarMount"></aside><div class="admin-body"><header id="headerMount"></header><main class="admin-main"><div class="page-head"><h1>Feedback</h1><p class="text-muted-2">Review user feedback</p></div><div class="tile admin-table-card" id="tableWrap"></div></main></div></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="../js/utils.js"></script><script src="../js/storage.js"></script><script src="../js/app.js"></script><script src="../js/admin-auth.js"></script><script src="../js/admin.js"></script>
<script>
(async function () {
  try { await requireAdmin(); } catch (e) { return; } afcMountLayout("feedback", { admin: true });
  var all = {};
  function render() {
    var rows = Object.keys(all).map(function (k) { return [k, all[k]]; }).sort(function (a,b) { return (b[1].createdAt || 0) - (a[1].createdAt || 0); });
    qs("#tableWrap").innerHTML = afcAdminTable({ columns: [
      { key:"userName", label:"User" }, { key:"rating", label:"Rating", render:function(r){ return "★".repeat(Math.max(0, Math.min(5, Number(r.rating)||0))); } },
      { key:"message", label:"Feedback" }, { key:"createdAt", label:"Date", render:function(r){ return r.createdAt ? afcFmtDateTime(r.createdAt) : "—"; } },
      { key:"status", label:"Status" }
    ], rows:rows, actions:[{icon:"eye-fill",title:"VIEW",cls:"btn-outline-primary"},{icon:"trash3-fill",title:"DELETE",cls:"btn-outline-danger"}] });
  }
  await afcDbOnValue("feedback", function (data) { all = data || {}; render(); afcLoaderOff(); });
  afcAdminBindActions(qs("#tableWrap"), { VIEW:async function(k){var f=all[k]; if(f) await afcConfirm({title:"Feedback from "+(f.userName||"User"),body:"<p>"+afcEscape(f.message)+"</p>",okText:"Close"});}, DELETE:async function(k){if(!await afcConfirmDelete("feedback"))return; await afcDbRemove("feedback/"+k); afcToast("Feedback deleted.","success");} });
})();
</script></body></html>
