<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Feedback · AI FITNESS COACH</title>
<script src="js/theme.js"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet"><link href="css/animations.css" rel="stylesheet"><link href="css/responsive.css" rel="stylesheet">
</head>
<body><div class="app-shell"><aside id="sidebarMount"></aside><div class="app-body"><header id="headerMount"></header><main class="app-main" id="mainContent">
  <div class="page-head"><h1><i class="bi bi-chat-heart-fill text-primary me-2"></i>Feedback</h1><p class="text-muted-2">How was your experience?</p></div>
  <div class="tile tile-pad" style="max-width:720px">
    <form id="feedbackForm">
      <div class="mb-4"><label class="form-label">Rating</label><div class="feedback-stars" role="radiogroup" aria-label="Rating">
        <button type="button" class="feedback-star" data-rating="1" aria-label="1 star">★</button><button type="button" class="feedback-star" data-rating="2" aria-label="2 stars">★</button><button type="button" class="feedback-star" data-rating="3" aria-label="3 stars">★</button><button type="button" class="feedback-star" data-rating="4" aria-label="4 stars">★</button><button type="button" class="feedback-star" data-rating="5" aria-label="5 stars">★</button>
      </div></div>
      <div class="mb-3"><label class="form-label" for="feedbackMessage">Feedback message</label><textarea class="form-control" id="feedbackMessage" rows="5" placeholder="Write your feedback here..." required></textarea></div>
      <div id="feedbackError" class="invalid-feedback-2 mb-3" role="alert"></div>
      <button class="btn btn-fire" type="submit"><i class="bi bi-send me-1"></i>Submit Feedback</button>
      <p id="feedbackSuccess" class="text-success fw-bold mt-3 mb-0" hidden>Thank you for your feedback! ❤️</p>
    </form>
  </div>
</main></div></div><nav id="bottomNavMount"></nav>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/utils.js"></script><script src="js/storage.js"></script><script src="js/app.js"></script><script src="js/auth.js"></script>
<script>
(async function () {
  try { await requireAuth({ allowIncomplete: true }); } catch (e) { return; }
  afcMountLayout("feedback");
  var rating = 0, stars = qsa(".feedback-star");
  stars.forEach(function (star) { star.addEventListener("click", function () { rating = Number(star.dataset.rating); stars.forEach(function (s) { s.classList.toggle("active", Number(s.dataset.rating) <= rating); }); }); });
  qs("#feedbackForm").addEventListener("submit", async function (e) {
    e.preventDefault(); var error = qs("#feedbackError"); error.textContent = "";
    if (!rating) { error.textContent = "Please select a rating."; return; }
    var message = qs("#feedbackMessage").value.trim(); if (!message) { error.textContent = "Please write a message."; return; }
    try {
      var session = window.AFC_SESSION || {}; var key = String(Date.now()) + "-" + Math.random().toString(36).slice(2, 8);
      await afcDbSet("feedback/" + key, { uid: session.uid || "", userName: (session.profile && session.profile.name) || "User", email: session.email || "", rating: rating, message: message, createdAt: Date.now(), status: "new" });
      qs("#feedbackSuccess").hidden = false; qs("#feedbackMessage").value = ""; rating = 0; stars.forEach(function (s) { s.classList.remove("active"); });
    } catch (err) { error.textContent = "Could not submit feedback. Please try again."; }
  });
})();
</script></body></html>
